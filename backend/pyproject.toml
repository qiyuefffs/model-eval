[project]
name = "eval-platform-backend"
version = "0.1.0"
description = "EvalPlatform 后端 — 基于 EvalScope 的模型评估平台"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "hywl" }
]
license = { text = "Apache-2.0" }

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",      # 文件上传

    # DB / ORM
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",             # 异步 SQLite

    # 配置 / 校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",

    # 安全 / 加密
    "cryptography>=43.0.0",          # API key 对称加密
    "python-jose[cryptography]>=3.3.0",

    # 日志
    "loguru>=0.7.0",

    # HTTP 客户端（测模型连通性、调用 evalscope perf）
    "httpx>=0.28.0",

    # 评测引擎
    "evalscope>=1.0.0",

    # 工具
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",                # 更快的 JSON
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长由 formatter 控制

[tool.ruff.lint.per-file-ignores]
# FastAPI 路由的 Depends/Path/Query 默认参数是官方惯用法，B008 误报
"api/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
